name: Build and deploy AeroSimLab Web

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'apps/simulator/**'
      - 'apps/headless/**'
      - 'modules/**'
      - 'assets/**'
      - 'scenarios/**'
      - 'third_party/**'
      - 'tools/web_runtime_smoke.cjs'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'apps/simulator/**'
      - 'apps/headless/**'
      - 'modules/**'
      - 'assets/**'
      - 'scenarios/**'
      - 'third_party/**'
      - 'tools/web_runtime_smoke.cjs'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.19
          actions-cache-folder: emsdk-cache

      - name: Show Emscripten version
        run: emcc -v

      - name: Configure web build
        run: emcmake cmake --preset emscripten-single-thread

      - name: Build web simulator
        run: cmake --build --preset emscripten-single-thread --target aerosimlab_simulator

      - name: Check and prepare Pages files
        run: |
          test -s build-emscripten-single-thread/aerosimlab_simulator.html
          test -s build-emscripten-single-thread/aerosimlab_simulator.js
          test -s build-emscripten-single-thread/aerosimlab_simulator.wasm
          mkdir -p _site
          cp build-emscripten-single-thread/aerosimlab_simulator.html _site/index.html
          cp build-emscripten-single-thread/aerosimlab_simulator.js _site/
          cp build-emscripten-single-thread/aerosimlab_simulator.wasm _site/
          sed -i "s/__SIMULATOR_VERSION__/${GITHUB_SHA}/g" _site/index.html
          touch _site/.nojekyll

      - name: Install web startup test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/web-smoke" --no-audit --no-fund playwright@1.64.1

      - name: Check simulator startup in Chromium
        timeout-minutes: 6
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node tools/web_runtime_smoke.cjs

      - name: Configure GitHub Pages
        if: ${{ env.PAGES_ADMIN_TOKEN == '' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Enable and configure GitHub Pages
        if: ${{ env.PAGES_ADMIN_TOKEN != '' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
