name: Build and deploy GraspLink Web

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.19
          actions-cache-folder: emsdk-cache

      - name: Show Emscripten version
        run: emcc -v

      - name: Configure web build
        run: emcmake cmake --preset emscripten-single-thread

      - name: Build web simulator
        run: cmake --build --preset emscripten-single-thread

      - name: Configure reusable threaded module
        run: emcmake cmake --preset emscripten-web

      - name: Build reusable threaded module
        run: cmake --build --preset emscripten-web --target grasplink_embed

      - name: Check and prepare Pages files
        run: |
          test -s build-emscripten-single-thread/index.html
          ! grep -q 'SharedArrayBuffer\|loadWasmModuleToWorker' build-emscripten-single-thread/index.html
          test -s build-emscripten-web/grasplink-embed.js
          grep -q 'createGraspLink' build-emscripten-web/grasplink-embed.js
          mkdir -p _site/embed
          cp build-emscripten-single-thread/index.html _site/index.html
          cp build-emscripten-web/grasplink-embed.* _site/embed/
          printf '{"revision":"%s","bundle":"/GraspLink/embed/grasplink-embed.js"}\\n' "$GITHUB_SHA" > _site/embed/manifest.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        if: ${{ env.PAGES_ADMIN_TOKEN == '' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Enable and configure GitHub Pages
        if: ${{ env.PAGES_ADMIN_TOKEN != '' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
