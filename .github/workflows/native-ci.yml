name: Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Ubuntu native build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install graphics and virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev \
            libopencv-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            clang-tidy \
            ninja-build \
            pkg-config \
            xvfb \
            xauth

      - name: Configure native Debug build
        run: cmake --preset linux-gcc-debug -DGLFW_BUILD_WAYLAND=OFF

      - name: Build native targets
        run: cmake --build --preset linux-gcc-debug --parallel 4

      - name: Run Clang static analysis
        run: |
          run-clang-tidy \
            -p build-linux-gcc-debug \
            -j 2 \
            -checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,bugprone-narrowing-conversions' \
            -warnings-as-errors='*' \
            -header-filter='^.*/(apps|modules|tests)/.*' \
            '^.*/(apps|modules|tests)/.*\.cpp$'

      - name: Run labeled CTest suite with virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24"
          ctest --test-dir build-linux-gcc-debug
          --output-on-failure --timeout 120
