<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AeroSimLab 시뮬레이터</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #141719; }
      body { display: grid; place-items: center; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #startup-status { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 24px; color: #e5e7eb; background: #141719; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      #startup-status[hidden] { display: none; }
      #startup-message { max-width: 560px; }
      #web-gcs { position: fixed; z-index: 2; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px; color: #f3f4f6; background: rgb(17 24 28 / 92%); border: 1px solid rgb(255 255 255 / 18%); border-radius: 10px; font: 13px/1.4 system-ui, sans-serif; }
      #web-gcs-status { min-width: 250px; }
      #web-gcs-status strong { display: block; font-size: 14px; }
      #web-gcs-status span { color: #cbd5d9; }
      #web-gcs-controls { display: flex; align-items: center; gap: 6px; }
      #web-gcs button { min-width: 42px; min-height: 38px; padding: 6px 10px; color: #f8fafc; background: #34434a; border: 1px solid #66777e; border-radius: 6px; font: inherit; touch-action: none; }
      #web-gcs button:hover:not(:disabled) { background: #46616b; }
      #web-gcs button:disabled { opacity: .55; }
      #web-gcs [data-command="0"] { background: #176b50; }
      #web-gcs [data-command="2"] { background: #8c3c3c; }
      #web-gcs [data-start-inspection] { background: #315f87; }
      #web-eo-recording { display: grid; gap: 5px; min-width: 190px; color: #d4dde0; }
      #web-eo-recording-controls { display: flex; flex-wrap: wrap; gap: 6px; }
      #web-eo-recording a { color: #9fd5ff; }
      #web-eo-recording a[hidden] { display: none; }
      @media (max-width: 720px) { #web-gcs { align-items: flex-start; flex-direction: column; } #web-gcs-status { min-width: 0; } #web-gcs-controls { flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <div id="startup-status" role="status" aria-live="polite">
      <div id="startup-message">시뮬레이터를 불러오고 있습니다.</div>
    </div>
    <canvas id="canvas" tabindex="0"></canvas>
    <section id="web-gcs" aria-label="웹 지상통제">
      <div id="web-gcs-status" aria-live="polite">
        <strong>지상통제 · 준비 중</strong>
        <span>가상 시험면 촬영 조건: 준비 중</span>
        <span id="web-gcs-mission">점검 임무: 대기 중</span>
      </div>
      <div id="web-eo-recording" aria-live="polite">
        <strong>EO 기록: 대기 중</strong>
        <div id="web-eo-recording-controls">
          <a id="web-eo-video-download" hidden>영상 내려받기</a>
          <a id="web-eo-manifest-download" hidden>촬영 기록 내려받기</a>
        </div>
      </div>
      <div id="web-gcs-controls">
        <button type="button" data-start-inspection disabled>자동 점검 시작</button>
        <button type="button" data-command="0" disabled>이륙</button>
        <button type="button" data-command="1" disabled>정지</button>
        <button type="button" data-axis="forward:1" disabled>전진</button>
        <button type="button" data-axis="forward:-1" disabled>후진</button>
        <button type="button" data-axis="right:-1" disabled>좌측</button>
        <button type="button" data-axis="right:1" disabled>우측</button>
        <button type="button" data-axis="vertical:1" disabled>상승</button>
        <button type="button" data-axis="vertical:-1" disabled>하강</button>
        <button type="button" data-axis="yaw:-1" disabled>좌회전</button>
        <button type="button" data-axis="yaw:1" disabled>우회전</button>
        <button type="button" data-command="2" disabled>착륙</button>
      </div>
    </section>
    <script>
      var simulatorVersion = "__SIMULATOR_VERSION__";
      var simulatorStarted = false;
      var startupMessage = document.getElementById("startup-message");
      var startupStatus = document.getElementById("startup-status");
      var startupPhase = startupMessage.textContent;
      var startupTimeout = window.setTimeout(function () {
        if (!simulatorStarted) {
          startupMessage.textContent = "시뮬레이터가 시작되지 않았습니다. 현재 단계: " + startupPhase;
          startupStatus.hidden = false;
        }
      }, 20000);
      var eoRecorder = null;
      var eoRecorderCanvas = null;
      var eoRecorderContext = null;
      var eoRecorderFrame = 0;
      var eoRecorderChunks = [];
      var eoTelemetrySamples = [];
      var eoRecordingStartedAt = 0;
      var eoLastTelemetrySampleAt = 0;
      var eoRecordingFinalizing = false;
      var latestGroundControlState = null;

      function showStartupError(message) {
        window.clearTimeout(startupTimeout);
        startupMessage.textContent = message;
        startupStatus.hidden = false;
        startupStatus.setAttribute("role", "alert");
      }

      window.setSimulatorStartupStatus = function (message) {
        startupPhase = message;
        startupMessage.textContent = message;
        startupStatus.hidden = false;
      };
      window.showSimulatorStartupError = showStartupError;
      window.completeSimulatorStartup = function () {
        simulatorStarted = true;
        window.clearTimeout(startupTimeout);
        startupStatus.hidden = true;
        document.querySelectorAll("#web-gcs button").forEach(function (button) {
          button.disabled = false;
        });
      };

      function setEoRecordingStatus(message) {
        document.querySelector("#web-eo-recording strong").textContent = "EO 기록: " + message;
      }

      function eoRecordingMimeType() {
        if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream)
          return "";
        return ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
          .find(function (type) { return MediaRecorder.isTypeSupported(type); }) || "";
      }

      function copyEoViewport() {
        if (!eoRecorder || !Module.canvas || !eoRecorderContext)
          return;
        var source = Module.canvas;
        var sourceX = Math.floor(source.width * 2 / 3);
        var sourceWidth = source.width - sourceX;
        if (sourceWidth > 0 && source.height > 0) {
          if (eoRecorderCanvas.width !== sourceWidth || eoRecorderCanvas.height !== source.height) {
            eoRecorderCanvas.width = sourceWidth;
            eoRecorderCanvas.height = source.height;
          }
          eoRecorderContext.drawImage(source, sourceX, 0, sourceWidth, source.height,
            0, 0, sourceWidth, source.height);
        }
        eoRecorderFrame = window.requestAnimationFrame(copyEoViewport);
      }

      async function finishEoRecording() {
        if (!eoRecorder || eoRecordingFinalizing)
          return;
        eoRecordingFinalizing = true;
        var recorder = eoRecorder;
        eoRecorder = null;
        window.cancelAnimationFrame(eoRecorderFrame);
        await new Promise(function (resolve) {
          recorder.addEventListener("stop", resolve, { once: true });
          recorder.stop();
        });
        recorder.stream.getTracks().forEach(function (track) { track.stop(); });

        var videoBlob = new Blob(eoRecorderChunks, { type: recorder.mimeType || "video/webm" });
        eoRecorderChunks = [];
        if (videoBlob.size === 0) {
          setEoRecordingStatus("영상 프레임이 없어 저장하지 못했습니다.");
          eoRecordingFinalizing = false;
          return;
        }

        var timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        var videoName = "dronesim-eo-" + timestamp + ".webm";
        var finalSample = eoTelemetrySamples[eoTelemetrySamples.length - 1];
        var videoUrl = URL.createObjectURL(videoBlob);
        var videoLink = document.getElementById("web-eo-video-download");
        videoLink.href = videoUrl;
        videoLink.download = videoName;
        videoLink.hidden = false;

        var sha256 = "계산할 수 없음";
        if (window.crypto && crypto.subtle) {
          try {
            var digest = await crypto.subtle.digest("SHA-256", await videoBlob.arrayBuffer());
            sha256 = Array.from(new Uint8Array(digest), function (value) {
              return value.toString(16).padStart(2, "0");
            }).join("");
          } catch (_) {
            sha256 = "계산할 수 없음";
          }
        }
        var manifest = {
          format_version: 1,
          collection_state: "CAPTURED",
          recording_source: "시뮬레이터 화면의 EO 시점 영역",
          video_file: videoName,
          video_mime_type: videoBlob.type,
          video_bytes: videoBlob.size,
          recording_duration_milliseconds: Math.round(performance.now() - eoRecordingStartedAt),
          mission_outcome: finalSample && finalSample.mission_status.indexOf("구도 확인 완료") >= 0
            ? "COMPLETED" : "FAILED",
          mission_status: finalSample ? finalSample.mission_status : "기록 없음",
          video_checksum_algorithm: sha256 === "계산할 수 없음" ? null : "SHA-256",
          video_checksum: sha256,
          simulation_tick_rate_hz: 60,
          coordinate_frame: "시뮬레이터 로컬 좌표, m",
          sample_interval_milliseconds: 250,
          samples: eoTelemetrySamples
        };
        var manifestBlob = new Blob([JSON.stringify(manifest, null, 2) + "\n"],
          { type: "application/json" });
        var manifestLink = document.getElementById("web-eo-manifest-download");
        manifestLink.href = URL.createObjectURL(manifestBlob);
        manifestLink.download = videoName.replace(/\.webm$/i, ".manifest.json");
        manifestLink.hidden = false;
        setEoRecordingStatus("영상과 촬영 기록을 내려받을 수 있습니다. "
          + (eoTelemetrySamples.length ? eoTelemetrySamples.length + "개 상태 표본" : "상태 표본 없음"));
        eoRecordingFinalizing = false;
      }

      function startEoRecording() {
        var mimeType = eoRecordingMimeType();
        if (!mimeType) {
          setEoRecordingStatus("이 브라우저는 화면 녹화를 지원하지 않습니다.");
          return false;
        }
        if (eoRecorder)
          return true;

        eoRecorderCanvas = document.createElement("canvas");
        eoRecorderContext = eoRecorderCanvas.getContext("2d");
        if (!eoRecorderContext) {
          setEoRecordingStatus("EO 화면을 준비하지 못했습니다.");
          return false;
        }
        eoTelemetrySamples = [];
        eoRecorderChunks = [];
        eoRecordingStartedAt = performance.now();
        eoLastTelemetrySampleAt = 0;
        var stream = null;
        try {
          stream = eoRecorderCanvas.captureStream(20);
          eoRecorder = new MediaRecorder(stream, { mimeType: mimeType });
          eoRecorder.addEventListener("dataavailable", function (event) {
            if (event.data && event.data.size > 0)
              eoRecorderChunks.push(event.data);
          });
          eoRecorder.addEventListener("error", function (event) {
            setEoRecordingStatus("브라우저 녹화 오류: "
              + (event.error?.message || "원인을 확인할 수 없습니다."));
          });
          eoRecorder.start(1000);
          copyEoViewport();
          setEoRecordingStatus("녹화 중");
          return true;
        } catch (error) {
          eoRecorder = null;
          if (stream)
            stream.getTracks().forEach(function (track) { track.stop(); });
          setEoRecordingStatus("녹화를 시작하지 못했습니다: " + error.message);
          return false;
        }
      }

      window.updateDroneSimGroundControl = function (mode, x, y, z, speed, cameraActive,
          captureAssessment, missionStatus, simulationTick) {
        latestGroundControlState = {
          mode: mode, x: x, y: y, z: z, speed: speed,
          cameraActive: cameraActive, captureAssessment: captureAssessment,
          missionStatus: missionStatus, simulationTick: simulationTick
        };
        var status = document.getElementById("web-gcs-status");
        var captureLabels = {
          ready: "구도 조건 충족",
          camera_unavailable: "카메라 꺼짐 또는 장애",
          no_new_frame: "새 영상 프레임 없음",
          too_near: "점검면에 너무 가까움",
          too_far: "점검면에 너무 멂",
          surface_facing_away: "점검면을 비스듬히 바라봄",
          outside_frame: "카메라 화면 밖",
          resolution_too_low: "화면에 담긴 크기가 부족함",
          occluded: "점검면이 가려짐",
          unknown: "판정할 수 없음"
        };
        status.innerHTML = "<strong>비행 상태: " + mode + "</strong>"
          + "<span>위치 " + x.toFixed(1) + ", " + y.toFixed(1) + ", " + z.toFixed(1)
          + " m · 속도 " + speed.toFixed(1) + " m/s · EO "
          + (cameraActive ? "켜짐" : "꺼짐") + "</span>"
          + "<span>가상 시험면 촬영 조건: "
          + (captureLabels[captureAssessment] || captureLabels.unknown)
          + " · 저장·전송 완료 판정은 아님</span>"
          + "<span id=\"web-gcs-mission\">점검 임무: " + missionStatus + "</span>";

      };

      window.updateDroneSimInspectionMetadata = function (cameraX, cameraY, cameraZ,
          quaternionX, quaternionY, quaternionZ, quaternionW, facilityId, zoneId) {
        if (eoRecorder && latestGroundControlState) {
          var elapsedMilliseconds = performance.now() - eoRecordingStartedAt;
          if (eoTelemetrySamples.length === 0
              || elapsedMilliseconds - eoLastTelemetrySampleAt >= 250) {
            eoLastTelemetrySampleAt = elapsedMilliseconds;
            var state = latestGroundControlState;
            eoTelemetrySamples.push({
              recording_elapsed_milliseconds: Math.round(elapsedMilliseconds),
              simulation_tick: state.simulationTick,
              simulation_time_seconds: state.simulationTick / 60,
              facility_id: facilityId,
              inspection_zone_id: zoneId,
              drone_position_meters: [state.x, state.y, state.z],
              camera_position_meters: [cameraX, cameraY, cameraZ],
              camera_orientation_xyzw: [quaternionX, quaternionY, quaternionZ, quaternionW],
              speed_meters_per_second: state.speed,
              camera_active: state.cameraActive,
              capture_assessment: state.captureAssessment,
              mission_status: state.missionStatus
            });
          }
        }
        if (eoRecorder && latestGroundControlState
            && (latestGroundControlState.missionStatus.indexOf("구도 확인 완료") >= 0
              || latestGroundControlState.missionStatus.indexOf("실패:") >= 0))
          void finishEoRecording();
      };

      (function () {
        var axes = { forward: 0, right: 0, vertical: 0, yaw: 0 };
        function sendAxes() {
          if (typeof Module._DroneSimWebPilotInput === "function")
            Module._DroneSimWebPilotInput(axes.forward, axes.right, axes.vertical, axes.yaw);
        }
        function releaseAll() {
          Object.keys(axes).forEach(function (axis) { axes[axis] = 0; });
          sendAxes();
        }

        document.querySelectorAll("#web-gcs [data-command]").forEach(function (button) {
          button.addEventListener("click", function () {
            if (typeof Module._DroneSimWebFlightCommand === "function")
              Module._DroneSimWebFlightCommand(Number(button.dataset.command));
          });
        });
        document.querySelector("#web-gcs [data-start-inspection]").addEventListener("click", function () {
          if (eoRecorder || eoRecordingFinalizing) {
            setEoRecordingStatus("현재 점검 임무의 녹화가 진행 중입니다.");
            return;
          }
          if (!startEoRecording())
            return;
          if (typeof Module._DroneSimWebStartInspectionMission !== "function"
              || !Module._DroneSimWebStartInspectionMission())
            void finishEoRecording();
        });
        document.querySelectorAll("#web-gcs [data-axis]").forEach(function (button) {
          var parts = button.dataset.axis.split(":");
          var axis = parts[0];
          var value = Number(parts[1]);
          function release() {
            axes[axis] = 0;
            sendAxes();
          }
          button.addEventListener("pointerdown", function (event) {
            event.preventDefault();
            axes[axis] = value;
            button.setPointerCapture(event.pointerId);
            sendAxes();
          });
          button.addEventListener("pointerup", release);
          button.addEventListener("pointercancel", release);
          button.addEventListener("lostpointercapture", release);
        });
        window.addEventListener("blur", releaseAll);
        document.addEventListener("visibilitychange", function () {
          if (document.hidden)
            releaseAll();
        });
      })();

      var Module = {
        canvas: document.getElementById("canvas"),
        locateFile: function (path) {
          if (!path.endsWith(".wasm"))
            window.setSimulatorStartupStatus("화면 자료를 불러오고 있습니다.");
          return path + "?rev=" + encodeURIComponent(simulatorVersion);
        },
        setStatus: function (text) {
          if (text && text !== "Running...")
            window.setSimulatorStartupStatus("시뮬레이터를 시작하고 있습니다.");
        },
        monitorRunDependencies: function (remaining) {
          if (remaining > 0)
            window.setSimulatorStartupStatus("시뮬레이터 실행에 필요한 자료를 준비하고 있습니다.");
        },
        onRuntimeInitialized: function () {
          window.setSimulatorStartupStatus("시뮬레이터를 시작하고 있습니다.");
        },
        onAbort: function (reason) {
          window.clearTimeout(startupTimeout);
          showStartupError("시뮬레이터를 시작하지 못했습니다. " + (reason || "새로고침해 주세요."));
        }
      };
    </script>
    <template id="simulator-script-template">
      {{{ SCRIPT }}}
    </template>
    <script>
      (function () {
        var status = document.getElementById("startup-status");
        var message = document.getElementById("startup-message");
        var source = document.getElementById("simulator-script-template").content.querySelector("script");
        if (!source) {
          message.textContent = "시뮬레이터 파일을 찾지 못했습니다. 새로고침해 주세요.";
          status.setAttribute("role", "alert");
          return;
        }

        var script = document.createElement("script");
        Array.from(source.attributes).forEach(function (attribute) {
          script.setAttribute(attribute.name, attribute.value);
        });
        script.src = source.getAttribute("src") + "?rev=" + encodeURIComponent(simulatorVersion);
        script.textContent = source.textContent;
        script.addEventListener("error", function () {
          showStartupError("시뮬레이터 실행 파일을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.");
        });
        window.addEventListener("error", function (event) {
          showStartupError("시뮬레이터 실행 중 오류가 발생했습니다. " + (event.message || "브라우저 콘솔을 확인해 주세요."));
        });
        window.addEventListener("unhandledrejection", function (event) {
          const reason = event.reason && event.reason.message
            ? event.reason.message
            : String(event.reason || "알 수 없는 오류");
          showStartupError("시뮬레이터 자료를 준비하지 못했습니다. " + reason);
        });
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
