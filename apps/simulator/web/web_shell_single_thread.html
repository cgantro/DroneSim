<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DroneSim | 비행과 카메라</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #0b1218;
        --panel: #121d25;
        --panel-raised: #182630;
        --border: #2b3c47;
        --muted: #93a5ae;
        --text: #edf4f7;
        --accent: #62c7bd;
        --blue: #3b82b2;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--page); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
      body { display: grid; grid-template-rows: 46px minmax(0, 1fr) 224px; gap: 10px; padding: 10px; }
      #app-header { display: flex; align-items: center; justify-content: space-between; min-width: 0; padding: 0 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; }
      #app-brand { display: flex; align-items: baseline; gap: 10px; }
      #app-brand strong { font-size: 15px; letter-spacing: .04em; }
      #app-brand span, #runtime-badge { color: var(--muted); font-size: 12px; }
      #runtime-badge { padding: 4px 9px; border: 1px solid var(--border); border-radius: 999px; }
      #runtime-badge[data-state="ready"] { color: #9be2d6; border-color: #287b6c; }
      #runtime-badge[data-state="error"] { color: #ffc0b8; border-color: #a94e48; }
      #sim-workspace { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); min-height: 0; gap: 10px; }
      #right-rail { display: grid; grid-template-rows: minmax(0, .8fr) minmax(0, 1.2fr); min-height: 0; gap: 10px; }
      .view-panel, #web-gcs { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
      #scene-panel { display: grid; grid-template-rows: 40px minmax(0, 1fr); }
      #scene-panel canvas { display: block; width: 150%; max-width: none; height: 100%; outline: none; }
      #camera-panel { display: grid; width: auto; max-width: 100%; height: 100%; aspect-ratio: 4 / 3; justify-self: end; align-self: stretch; grid-template-rows: 40px minmax(0, 1fr); }
      .panel-title { display: flex; align-items: center; padding: 0 13px; color: #dce8ed; border-bottom: 1px solid var(--border); font-weight: 650; letter-spacing: .01em; }
      #web-eo-live { display: grid; grid-template-rows: 28px minmax(0, 1fr); min-height: 0; padding: 9px; gap: 5px; }
      #web-eo-live-status { color: var(--muted); font-size: 12px; }
      #web-eo-live video { display: block; width: 100%; height: 100%; min-height: 0; background: #05090c; object-fit: contain; border-radius: 5px; }
      #startup-status { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--text); background: #0a1015f2; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      #startup-status[hidden] { display: none; }
      #startup-message { max-width: 560px; }
      #flight-status-panel { display: grid; min-height: 0; grid-template-rows: 40px minmax(0, 1fr); }
      #web-gcs-status { display: grid; align-content: start; gap: 6px; min-width: 0; padding: 8px; overflow: auto; }
      .status-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .status-heading strong { font-size: 15px; }
      #web-gcs-clock { color: var(--muted); font: 11px/1.4 ui-monospace, monospace; white-space: nowrap; }
      .telemetry-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .telemetry-card { display: grid; gap: 2px; min-width: 0; padding: 5px 7px; background: var(--panel-raised); border: 1px solid #243641; border-radius: 7px; }
      .telemetry-card span { color: var(--muted); font-size: 11px; }
      .telemetry-card strong { overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
      #web-gcs-mission-card { grid-column: 1 / -1; }
      #web-gcs-capture { margin: 0; color: #d3e0e5; font-size: 11px; }
      #web-gcs { display: grid; grid-template-columns: minmax(230px, .75fr) minmax(0, 2fr); align-items: stretch; gap: 12px; padding: 11px; font: 13px/1.4 system-ui, sans-serif; }
      #web-eo-recording, .control-group { display: grid; align-content: start; gap: 8px; min-width: 0; padding: 10px; background: var(--panel-raised); border: 1px solid #243641; border-radius: 8px; }
      #web-eo-recording { color: #d4dde0; }
      #web-eo-recording > strong, .control-group h3 { margin: 0; color: var(--text); font-size: 13px; font-weight: 650; }
      #web-eo-recording-controls { display: grid; align-content: start; gap: 8px; min-height: 0; overflow: auto; }
      #web-eo-zone-downloads, #web-eo-saved-files { display: grid; gap: 5px; max-height: 70px; overflow: auto; }
      #web-eo-saved-files details > summary { color: var(--muted); cursor: pointer; }
      #web-eo-recording a { color: #9fd5ff; }
      #web-eo-recording a[hidden] { display: none; }
      #web-gcs-controls { display: grid; grid-template-columns: minmax(190px, .9fr) minmax(0, 1.5fr); align-content: stretch; gap: 10px; min-height: 0; }
      .control-group { align-content: center; }
      .control-group h3 { color: #b8c8cf; }
      #inspection-target-label { color: var(--muted); font-size: 12px; }
      #mission-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      #flight-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      #web-gcs button { min-width: 0; min-height: 36px; padding: 6px 8px; color: var(--text); background: #263741; border: 1px solid #3a505c; border-radius: 6px; font: inherit; font-size: 12px; white-space: nowrap; touch-action: none; transition: background-color .12s ease, border-color .12s ease; }
      #web-gcs button:hover:not(:disabled) { background: #36505d; border-color: #5b7a87; }
      #web-gcs button:focus-visible, #web-gcs select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #web-gcs button:disabled { opacity: .48; }
      #web-gcs [data-command="0"] { background: #176b50; border-color: #2f9471; }
      #web-gcs [data-command="2"], #web-gcs [data-cancel-inspection] { background: #713b3b; border-color: #99504a; }
      #web-gcs [data-start-inspection] { background: #245d79; border-color: #3980a2; }
      #web-gcs [data-inspection-target] { min-width: 0; min-height: 36px; padding: 6px 8px; color: var(--text); background: #101a21; border: 1px solid #3a505c; border-radius: 6px; font: inherit; }
      @media (min-width: 1001px) {
        .telemetry-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        #web-gcs-mission-card { grid-column: span 2; }
      }
      @media (max-width: 1000px) {
        body { grid-template-rows: 42px minmax(0, 1fr) minmax(240px, 32vh); gap: 8px; padding: 8px; }
        #sim-workspace { grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 8px; }
        #right-rail { gap: 8px; }
        #right-rail { grid-template-rows: repeat(2, minmax(0, 1fr)); }
        #web-gcs { grid-template-columns: minmax(0, 1fr); overflow: auto; }
        #web-eo-recording { max-height: 110px; }
      }
      @media (max-width: 650px) {
        body { grid-template-rows: 40px minmax(0, 1fr) minmax(260px, 42vh); gap: 7px; padding: 7px; }
        #app-brand span { display: none; }
        #sim-workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.3fr) minmax(170px, .8fr); gap: 7px; }
        #right-rail { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 7px; }
        #flight-status-panel .panel-title { writing-mode: horizontal-tb; }
        #camera-panel { width: auto; height: auto; aspect-ratio: auto; align-self: stretch; grid-template-columns: 34px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
        #camera-panel .panel-title { writing-mode: vertical-rl; justify-content: center; padding: 6px; }
        #web-eo-live { grid-template-rows: minmax(0, 1fr); }
        #web-eo-live-status { display: none; }
        #web-gcs { grid-template-columns: minmax(0, 1fr); gap: 7px; }
        #web-gcs-controls { grid-template-columns: minmax(0, 1fr); gap: 7px; }
        #mission-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        #flight-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div id="startup-status" role="status" aria-live="polite">
      <div id="startup-message">시뮬레이터를 불러오고 있습니다.</div>
    </div>
    <header id="app-header">
      <div id="app-brand"><strong>DRONESIM</strong><span>영상 정찰 · 지상통제</span></div>
      <span id="runtime-badge" data-state="loading" title="웹 실행은 운동학 비행 모델을 사용합니다. 네이티브 AirSim 강체 물리와 결과가 다를 수 있습니다.">시뮬레이터 준비 중</span>
    </header>
    <main id="sim-workspace">
      <section id="scene-panel" class="view-panel" aria-label="드론을 보는 장면">
        <div class="panel-title">비행 장면</div>
        <canvas id="canvas" tabindex="0"></canvas>
      </section>
      <aside id="right-rail" aria-label="비행 정보와 카메라">
        <section id="flight-status-panel" class="view-panel" aria-label="비행 상태">
          <div class="panel-title">비행 상태</div>
          <div id="web-gcs-status" aria-live="polite">
            <div class="status-heading">
              <strong id="web-gcs-mode">상태 대기 중</strong>
              <span id="web-gcs-clock">T+0.0 s</span>
            </div>
            <div class="telemetry-grid">
              <div class="telemetry-card"><span>위치 · 동 / 북</span><strong id="web-gcs-position">0.0 / 0.0 m</strong></div>
              <div class="telemetry-card"><span>지면 위 고도</span><strong id="web-gcs-altitude">0.0 m</strong></div>
              <div class="telemetry-card"><span>이동 속도</span><strong id="web-gcs-speed">0.0 m/s</strong></div>
              <div class="telemetry-card"><span>EO 카메라</span><strong id="web-gcs-camera">준비 중</strong></div>
              <div class="telemetry-card" id="web-gcs-mission-card"><span>영상 정찰</span><strong id="web-gcs-mission">대기 중</strong></div>
            </div>
            <p id="web-gcs-capture">영상 구도 상태: 시뮬레이터 준비 중</p>
          </div>
        </section>
        <section id="camera-panel" class="view-panel" aria-label="드론 카메라 영상">
          <div class="panel-title">드론 카메라 · 1280 × 960</div>
          <div id="web-eo-live" aria-live="polite">
            <strong id="web-eo-live-status">영상 연결 준비 중</strong>
            <video id="web-eo-live-video" autoplay muted playsinline></video>
          </div>
        </section>
      </aside>
    </main>
    <section id="web-gcs" aria-label="웹 지상통제">
      <div id="web-eo-recording" aria-live="polite">
        <strong>EO 기록: 대기 중</strong>
        <div id="web-eo-recording-controls">
          <a id="web-eo-video-download" hidden>영상 내려받기</a>
          <a id="web-eo-manifest-download" hidden>촬영 기록 내려받기</a>
          <div id="web-eo-zone-downloads" aria-label="구역별 촬영 영상"></div>
          <strong id="web-eo-saved-title">이 브라우저에 저장된 자료</strong>
          <div id="web-eo-saved-files" aria-label="브라우저 저장 자료"></div>
        </div>
      </div>
      <div id="web-gcs-controls">
        <section class="control-group" aria-label="영상 정찰 임무">
          <h3>사람이 지정한 영상 수집 지점</h3>
          <label id="inspection-target-label" for="inspection-target">수집할 지점</label>
          <select id="inspection-target" data-inspection-target disabled>
            <option value="-1">모든 촬영 위치</option>
          </select>
          <div id="mission-actions">
            <button type="button" data-start-inspection disabled>수집 시작</button>
            <button type="button" data-pause-inspection disabled
                title="이동·카메라 정렬 중에만 가능하며, 영상 기록은 계속됩니다.">일시 정지</button>
            <button type="button" data-resume-inspection disabled>재개</button>
            <button type="button" data-cancel-inspection disabled>수집 중단</button>
          </div>
        </section>
        <section class="control-group" aria-label="수동 비행 조작">
          <h3>수동 비행 조작</h3>
          <div id="flight-actions">
            <button type="button" data-command="0" disabled>이륙</button>
            <button type="button" data-command="1" disabled>정지</button>
            <button type="button" data-command="2" disabled>착륙</button>
            <button type="button" data-axis="forward:1" disabled>전진</button>
            <button type="button" data-axis="forward:-1" disabled>후진</button>
            <button type="button" data-axis="right:-1" disabled>좌측</button>
            <button type="button" data-axis="right:1" disabled>우측</button>
            <button type="button" data-axis="vertical:1" disabled>상승</button>
            <button type="button" data-axis="vertical:-1" disabled>하강</button>
            <button type="button" data-axis="yaw:-1" disabled>좌회전</button>
            <button type="button" data-axis="yaw:1" disabled>우회전</button>
          </div>
        </section>
      </div>
    </section>
    <script>
      var simulatorVersion = "__SIMULATOR_VERSION__";
      var simulatorStarted = false;
      var startupMessage = document.getElementById("startup-message");
      var startupStatus = document.getElementById("startup-status");
      var startupPhase = startupMessage.textContent;
      var startupTimeout = window.setTimeout(function () {
        if (!simulatorStarted) {
          startupMessage.textContent = "시뮬레이터가 시작되지 않았습니다. 현재 단계: " + startupPhase;
          startupStatus.hidden = false;
        }
      }, 20000);
      var eoRecorder = null;
      var eoRecorderVideoTrack = null;
      var eoStreamCanvas = document.createElement("canvas");
      var eoStreamContext = eoStreamCanvas.getContext("2d");
      var eoViewport = null;
      var eoCanvasFrame = 0;
      var eoCanvasCopyActive = false;
      var eoLastCanvasCopyAt = -Infinity;
      var eoCanvasCopyIntervalMilliseconds = 1000 / 24;
      var eoWebRtcStream = null;
      var eoWebRtcSender = null;
      var eoWebRtcReceiver = null;
      var eoRecorderChunks = [];
      var eoRecorderChunkChecksums = [];
      var eoRecorderSink = null;
      var eoRecorderFileName = "";
      var eoZoneRecorder = null;
      var eoZoneRecorderChunks = [];
      var eoZoneRecordings = [];
      var eoZoneRecordingPromises = [];
      var eoCaptureImages = [];
      var eoCaptureImagePromises = [];
      var eoActiveZoneRecording = null;
      var eoTelemetrySamples = [];
      var eoCaptureEvents = [];
      var latestEoCaptureMetadata = null;
      var eoExpectedZones = [];
      var eoInspectionTargets = [];
      var eoRecordingStartedAt = 0;
      var eoLastTelemetrySampleAt = 0;
      var eoRecordingFinalizing = false;
      var latestGroundControlState = null;
      var eoDownloadUrls = [];

      function showStartupError(message) {
        window.clearTimeout(startupTimeout);
        startupMessage.textContent = message;
        startupStatus.hidden = false;
        startupStatus.setAttribute("role", "alert");
        var badge = document.getElementById("runtime-badge");
        badge.textContent = "시작 오류";
        badge.dataset.state = "error";
      }

      window.setSimulatorStartupStatus = function (message) {
        startupPhase = message;
        startupMessage.textContent = message;
        startupStatus.hidden = false;
        var badge = document.getElementById("runtime-badge");
        badge.textContent = "시뮬레이터 준비 중";
        badge.dataset.state = "loading";
      };
      window.showSimulatorStartupError = showStartupError;
      window.completeSimulatorStartup = function () {
        simulatorStarted = true;
        window.clearTimeout(startupTimeout);
        startupStatus.hidden = true;
        var badge = document.getElementById("runtime-badge");
        badge.textContent = "웹 운동학 · 실행 중";
        badge.dataset.state = "ready";
        document.querySelectorAll("#web-gcs button").forEach(function (button) {
          button.disabled = false;
        });
        document.querySelector("#inspection-target").disabled = false;
        refreshSavedRecordingLinks().catch(function (error) {
          setEoRecordingStatus("저장 자료를 읽지 못했습니다: " + error.message);
        });
        startEoWebRtcLoopback().catch(function (error) {
          closeEoWebRtc();
          setEoLiveStatus("EO 영상 · WebRTC 연결 실패: " + error.message);
        });
      };

      window.setDroneSimEoViewport = function (x, y, width, height) {
        eoViewport = { x: x, y: y, width: width, height: height };
      };

      window.clearDroneSimInspectionTargets = function () {
        var select = document.querySelector("#inspection-target");
        while (select.options.length > 1)
          select.remove(1);
        eoInspectionTargets = [];
      };
      window.addDroneSimInspectionTarget = function (index, facilityId, zoneId) {
        var option = document.createElement("option");
        option.value = String(index);
        option.dataset.facilityId = facilityId;
        option.textContent = "촬영 위치 " + (eoInspectionTargets.length + 1);
        document.querySelector("#inspection-target").add(option);
        eoInspectionTargets.push({
          index: Number(index), facility_id: facilityId, inspection_zone_id: zoneId
        });
      };

      function beginInspectionCaptureRecord(targetIndex) {
        eoCaptureEvents = [];
        eoZoneRecordings = [];
        eoZoneRecordingPromises = [];
        eoCaptureImages = [];
        eoCaptureImagePromises = [];
        eoActiveZoneRecording = null;
        latestEoCaptureMetadata = null;
        eoExpectedZones = eoInspectionTargets
          .filter(function (target) { return targetIndex < 0 || target.index === targetIndex; })
          .map(function (target) {
            return {
              facility_id: target.facility_id,
              inspection_zone_id: target.inspection_zone_id
            };
          });
      }

      window.startDroneSimInspectionZoneRecording = function (
          facilityId, zoneId, simulationTick) {
        if (!eoRecorder || eoZoneRecorder || eoRecordingFinalizing)
          return;
        var target = eoExpectedZones.find(function (zone) {
          return zone.inspection_zone_id === zoneId;
        });
        if (!target)
          return;
        try {
          var chunks = [];
          eoZoneRecorderChunks = chunks;
          eoActiveZoneRecording = {
            facility_id: facilityId,
            inspection_zone_id: zoneId,
            start_simulation_tick: Number(simulationTick),
            start_recording_elapsed_milliseconds:
              Math.round(performance.now() - eoRecordingStartedAt)
          };
          eoZoneRecorder = new MediaRecorder(eoRecorder.stream, {
            mimeType: eoRecorder.mimeType
          });
          eoZoneRecorder.addEventListener("dataavailable", function (event) {
            if (event.data && event.data.size > 0)
              chunks.push(event.data);
          });
          eoZoneRecorder.addEventListener("error", function (event) {
            setEoRecordingStatus("구역 영상 녹화 오류: "
              + (event.error?.message || "원인을 확인할 수 없습니다."));
          });
          eoZoneRecorder.start(100);
        } catch (error) {
          eoZoneRecorder = null;
          eoActiveZoneRecording = null;
          eoZoneRecorderChunks = [];
          eoZoneRecordings.push({
            facility_id: facilityId,
            inspection_zone_id: zoneId,
            start_simulation_tick: Number(simulationTick),
            collection_state: "FAILED",
            failure_reason: error.message
          });
          setEoRecordingStatus("구역 영상 녹화를 시작하지 못했습니다: " + error.message);
        }
      };

      async function finishInspectionZoneRecording(captureEvent) {
        if (!eoZoneRecorder || !eoActiveZoneRecording)
          return null;
        var recorder = eoZoneRecorder;
        var recording = eoActiveZoneRecording;
        var chunks = eoZoneRecorderChunks;
        eoZoneRecorder = null;
        eoActiveZoneRecording = null;
        eoZoneRecorderChunks = [];
        await new Promise(function (resolve) {
          recorder.addEventListener("stop", resolve, { once: true });
          recorder.stop();
        });
        var videoBlob = new Blob(chunks, {
          type: recorder.mimeType || "video/webm"
        });
        if (videoBlob.size === 0) {
          eoZoneRecordings.push(Object.assign({}, recording, {
            collection_state: "FAILED",
            failure_reason: "영상 프레임이 녹화되지 않았습니다."
          }));
          return null;
        }

        var timestamp = recordingTimestamp();
        var zoneName = recording.inspection_zone_id.replace(/[^a-zA-Z0-9_-]+/g, "-");
        var videoName = "DroneSim_Zone_" + zoneName + "_" + timestamp + ".webm";
        var storedVideo = await saveRecordingToBrowser(videoName, videoBlob);
        var sourceChecksum = await sha256Hex(videoBlob);
        var checksum = await sha256Hex(storedVideo.file);
        var storageMatchesCapture = storedVideo.saved
          && sourceChecksum !== null && checksum === sourceChecksum;
        var savedRecording = Object.assign({}, recording, {
          collection_state: "CAPTURED",
          storage_state: storedVideo.saved ? "SAVED" : "CAPTURED",
          storage_backend: storedVideo.saved ? "OPFS" : "다운로드 전용",
          verification_state: storageMatchesCapture ? "VERIFIED" : "UNVERIFIED",
          video_storage_matches_capture: storageMatchesCapture,
          download_ready: true,
          video_file: videoName,
          video_mime_type: videoBlob.type,
          video_bytes: storedVideo.file.size,
          video_checksum_algorithm: checksum ? "SHA-256" : null,

      async function saveInspectionCaptureImage(captureEvent, metadata) {
        var imageRecord = {
          facility_id: captureEvent.facility_id,
          inspection_zone_id: captureEvent.inspection_zone_id,
          simulation_tick: captureEvent.simulation_tick,
          simulation_time_seconds: captureEvent.simulation_time_seconds,

          drone_position_meters: metadata ? metadata.drone_position_meters : null,
          camera_position_meters: metadata ? metadata.camera_position_meters : null,
          camera_orientation_xyzw: metadata ? metadata.camera_orientation_xyzw : null,
          capture_assessment: metadata ? metadata.capture_assessment : null
        };

        try {
          if (!eoStreamCanvas || eoStreamCanvas.width === 0 || eoStreamCanvas.height === 0)
            throw new Error("EO 화면이 비어 있습니다.");

          var imageHeight = eoStreamCanvas.height;

          var storedImage = await saveRecordingToBrowser(imageName, imageBlob);
          var checksum = await sha256Hex(storedImage.file);

            collection_state: "CAPTURED",

            storage_backend: storedImage.saved ? "OPFS" : "다운로드 전용",

            download_ready: true,

            image_width: imageWidth,
            image_height: imageHeight,
            image_bytes: storedImage.file.size,
            image_checksum_algorithm: checksum ? "SHA-256" : null,
            image_checksum: checksum,
            image_storage_matches_capture: storageMatchesCapture

          link.href = createDownloadUrl(storedImage.file);

        } catch (error) {

      function setEoRecordingStatus(message) {

      }

      function createDownloadUrl(file) {

      async function sha256Hex(blob) {
        if (!window.crypto || !crypto.subtle)
          return null;
        try {
          var digest = await crypto.subtle.digest("SHA-256", await blob.arrayBuffer());
          return Array.from(new Uint8Array(digest), function (value) {
            return value.toString(16).padStart(2, "0");
          }).join("");
        } catch (_) {
          return null;
        }
      }

      async function storedChunksMatchCapture(file, chunkChecksums) {
        if (!chunkChecksums.length)
          return false;
        var offset = 0;
        for (var chunk of chunkChecksums) {
          var expectedChecksum = await chunk.checksum;
          if (!expectedChecksum || offset + chunk.bytes > file.size
              || await sha256Hex(file.slice(offset, offset + chunk.bytes)) !== expectedChecksum)
            return false;
          offset += chunk.bytes;
        }
        return offset === file.size;
      }

      async function openRecordingSink(fileName) {
        if (!navigator.storage || typeof navigator.storage.getDirectory !== "function")
          return null;
        try {
          var root = await navigator.storage.getDirectory();
          var directory = await root.getDirectoryHandle("DroneSim", { create: true });
          var fileHandle = await directory.getFileHandle(fileName, { create: true });
          var writable = await fileHandle.createWritable();
          return {
            fileHandle: fileHandle,
            writable: writable,
            pendingWrite: Promise.resolve(),
            error: null,
            append: function (chunk) {
              if (this.error)
                return;
              this.pendingWrite = this.pendingWrite
                .then(() => this.error ? undefined : this.writable.write(chunk))
                .catch((error) => { this.error = error; });
            },
            finish: async function () {
              await this.pendingWrite;
              if (this.error) {
                try { await this.writable.abort(); } catch (_) {}
                try { await directory.removeEntry(fileName); } catch (_) {}
                throw this.error;
              }
              try {
                await this.writable.close();
                return await this.fileHandle.getFile();
              } catch (error) {
                try { await this.writable.abort(); } catch (_) {}
                try { await directory.removeEntry(fileName); } catch (_) {}
                throw error;
              }
            },
            abort: async function () {
              try { await this.writable.abort(); } catch (_) {}
              try { await directory.removeEntry(fileName); } catch (_) {}
            }
          };
        } catch (error) {
          setEoRecordingStatus("브라우저에 바로 저장할 수 없어 녹화 조각을 메모리에 보관합니다: "
            + error.message);
          return null;
        }
      }

      async function saveRecordingToBrowser(fileName, blob) {
        if (!navigator.storage || typeof navigator.storage.getDirectory !== "function")
          return { file: blob, saved: false };

        var directory = null;
        var writable = null;
        try {
          var root = await navigator.storage.getDirectory();
          directory = await root.getDirectoryHandle("DroneSim", { create: true });
          var fileHandle = await directory.getFileHandle(fileName, { create: true });
          writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
          return { file: await fileHandle.getFile(), saved: true };
        } catch (error) {
          if (writable) {
            try { await writable.abort(); } catch (_) {}
          }
          if (directory) {
            try { await directory.removeEntry(fileName); } catch (_) {}
          }
          setEoRecordingStatus("브라우저 저장에 실패해 내려받기만 준비했습니다: "
            + error.message);
          return { file: blob, saved: false };
        }
      }

      function recordingTimestamp(date) {
        var value = date || new Date();
        var pad = function (part, width) { return String(part).padStart(width, "0"); };
        return String(value.getFullYear())
          + pad(value.getMonth() + 1, 2) + pad(value.getDate(), 2) + "_"
          + pad(value.getHours(), 2) + pad(value.getMinutes(), 2)
          + pad(value.getSeconds(), 2) + "_" + pad(value.getMilliseconds(), 3);
      }

      function savedFileLabel(file) {
        var name = file.name.toLowerCase();
        var kind = name.endsWith(".manifest.json") ? "촬영 기록"
          : name.indexOf("_image_") >= 0 ? "정지 사진"
          : name.indexOf("_zone_") >= 0 ? "구역 영상" : "임무 영상";
        var savedAt = new Intl.DateTimeFormat("ko-KR", {
          month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
        }).format(file.lastModified);
        var size = file.size < 1024 * 1024
          ? Math.max(1, Math.round(file.size / 1024)) + " KB"
          : (file.size / (1024 * 1024)).toFixed(1) + " MB";
        return kind + " · " + savedAt + " · " + size;
      }

      function createSavedFileLink(entry, file) {
        var link = document.createElement("a");
        link.href = createDownloadUrl(file);
        link.download = entry.name;
        link.dataset.opfsFile = entry.name;
        link.title = entry.name;

      async function refreshSavedRecordingLinks() {
        var container = document.getElementById("web-eo-saved-files");
        var title = document.getElementById("web-eo-saved-title");
        container.replaceChildren();
        if (!navigator.storage || typeof navigator.storage.getDirectory !== "function") {
          container.textContent = "이 브라우저는 영구 저장을 지원하지 않습니다.";
          return;
        }

        var root = await navigator.storage.getDirectory();
        var directory;
        try {
          directory = await root.getDirectoryHandle("DroneSim");
        } catch (error) {
          if (error.name === "NotFoundError") {
            container.textContent = "저장된 자료가 없습니다.";
            return;
          }
          throw error;
        }

        var entries = [];
        for await (var entry of directory.values()) {
          if (entry.kind === "file")
            entries.push({ handle: entry, file: await entry.getFile() });
        }
        entries.sort(function (left, right) {
          return right.file.lastModified - left.file.lastModified;
        });
        if (entries.length === 0) {
          container.textContent = "저장된 자료가 없습니다.";
          return;
        }
        title.textContent = "이 브라우저에 저장된 자료 · " + entries.length + "개";
        var recentLimit = 5;
        var recentList = document.createElement("div");
        recentList.className = "recording-links";
        for (var index = 0; index < Math.min(entries.length, recentLimit); ++index) {
          recentList.appendChild(createSavedFileLink(
            entries[index].handle, entries[index].file));
        }
        container.appendChild(recentList);
        if (entries.length > recentLimit) {
          var archive = document.createElement("details");
          var summary = document.createElement("summary");
          summary.textContent = "이전 자료 " + (entries.length - recentLimit) + "개";
          archive.appendChild(summary);
          var archiveList = document.createElement("div");
          archiveList.className = "recording-links";
          for (var oldIndex = recentLimit; oldIndex < entries.length; ++oldIndex) {
            archiveList.appendChild(createSavedFileLink(
              entries[oldIndex].handle, entries[oldIndex].file));
          }
          archive.appendChild(archiveList);
          container.appendChild(archive);
        }
      }

      function waitForIceGathering(pc) {
        if (pc.iceGatheringState === "complete")
          return Promise.resolve();
        return new Promise(function (resolve, reject) {
          var timeout = window.setTimeout(function () {
            pc.removeEventListener("icegatheringstatechange", checkState);
            reject(new Error("ICE 후보 수집 시간이 초과됐습니다."));
          }, 10000);
          function checkState() {
            if (pc.iceGatheringState !== "complete")
              return;
            window.clearTimeout(timeout);
            pc.removeEventListener("icegatheringstatechange", checkState);
            resolve();
          }
          pc.addEventListener("icegatheringstatechange", checkState);
        });
      }

      function waitForRtcConnection(pc) {
        if (pc.connectionState === "connected")
          return Promise.resolve();
        return new Promise(function (resolve, reject) {
          var timeout = window.setTimeout(function () {
            pc.removeEventListener("connectionstatechange", checkState);
            reject(new Error("영상 수신 연결 시간이 초과됐습니다."));
          }, 10000);
          function checkState() {
            if (pc.connectionState === "connected") {
              window.clearTimeout(timeout);
              pc.removeEventListener("connectionstatechange", checkState);
              resolve();
            } else if (pc.connectionState === "failed") {
              window.clearTimeout(timeout);
              pc.removeEventListener("connectionstatechange", checkState);
              reject(new Error("브라우저 WebRTC 연결이 실패했습니다."));
            }
          }
          pc.addEventListener("connectionstatechange", checkState);
          checkState();
        });
      }

      function closeEoWebRtc() {
        if (eoWebRtcSender) {
          if (eoWebRtcSender.signalingState !== "closed")
            eoWebRtcSender.close();
        }
        if (eoWebRtcReceiver) {
          if (eoWebRtcReceiver.signalingState !== "closed")
            eoWebRtcReceiver.close();
        }
        if (eoWebRtcStream) {
          eoWebRtcStream.getTracks().forEach(function (track) { track.stop(); });
        }
      }

      async function startEoWebRtcLoopback() {
        if (!window.RTCPeerConnection || !HTMLCanvasElement.prototype.captureStream)
          throw new Error("이 브라우저는 WebRTC 영상 수신을 지원하지 않습니다.");
        if (!eoStreamContext)
          throw new Error("EO 영상 캔버스를 만들지 못했습니다.");

        setEoLiveStatus("EO 영상 · 전송 경로 연결 중");
        startEoViewportCopy();
        eoWebRtcStream = eoStreamCanvas.captureStream(24);
        eoWebRtcSender = new RTCPeerConnection({ iceServers: [] });
        eoWebRtcReceiver = new RTCPeerConnection({ iceServers: [] });
        var liveVideo = document.querySelector("#web-eo-live-video");
        eoWebRtcSender.addEventListener("connectionstatechange", function () {
          if (eoWebRtcSender.connectionState === "disconnected"
              || eoWebRtcSender.connectionState === "failed")
            setEoLiveStatus("EO 영상 · WebRTC 연결 끊김");
        });
        eoWebRtcReceiver.addEventListener("track", function (event) {
          liveVideo.srcObject = event.streams[0];
          void liveVideo.play().catch(function () {});
        });
        eoWebRtcStream.getTracks().forEach(function (track) {
          eoWebRtcSender.addTrack(track, eoWebRtcStream);
        });

        await eoWebRtcSender.setLocalDescription(
          await eoWebRtcSender.createOffer());
        await waitForIceGathering(eoWebRtcSender);
        await eoWebRtcReceiver.setRemoteDescription(eoWebRtcSender.localDescription);
        await eoWebRtcReceiver.setLocalDescription(
          await eoWebRtcReceiver.createAnswer());
        await waitForIceGathering(eoWebRtcReceiver);
        await eoWebRtcSender.setRemoteDescription(eoWebRtcReceiver.localDescription);
        await waitForRtcConnection(eoWebRtcSender);
        setEoLiveStatus("EO 영상 · 로컬 WebRTC 수신 연결됨");
      }

      function eoRecordingMimeType() {
        if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream)
          return "";

          .find(function (type) { return MediaRecorder.isTypeSupported(type); }) || "";
      }

      function startEoViewportCopy() {
        if (eoCanvasCopyActive)
          return;

        eoCanvasFrame = window.requestAnimationFrame(copyEoViewport);

      function copyEoViewport(timestamp) {
        if (!eoCanvasCopyActive)
          return;

        if (timestamp - eoLastCanvasCopyAt >= eoCanvasCopyIntervalMilliseconds) {
          eoLastCanvasCopyAt = timestamp;
          if (Module.canvas && eoStreamContext && eoViewport
              && eoViewport.width > 0 && eoViewport.height > 0) {
            var source = Module.canvas;
            if (eoStreamCanvas.width !== eoViewport.width
                || eoStreamCanvas.height !== eoViewport.height) {
              eoStreamCanvas.width = eoViewport.width;
              eoStreamCanvas.height = eoViewport.height;
            }
            if (eoViewport.x + eoViewport.width <= source.width
                && eoViewport.y + eoViewport.height <= source.height) {
              eoStreamContext.drawImage(source,
                eoViewport.x, eoViewport.y, eoViewport.width, eoViewport.height,
                0, 0, eoViewport.width, eoViewport.height);
            }
          }
        }
        eoCanvasFrame = window.requestAnimationFrame(copyEoViewport);
      }

      async function finishEoRecording() {

          var incompleteRecorder = eoZoneRecorder;
          eoZoneRecorder = null;
          eoActiveZoneRecording = null;

            incompleteRecorder.addEventListener("stop", resolve, { once: true });
            incompleteRecorder.stop();
          });
          eoZoneRecorderChunks = [];
          eoZoneRecordings.push(Object.assign(incompleteRecording, {
            collection_state: "INCOMPLETE",
            video_file: null,
            video_bytes: 0,
            video_checksum_algorithm: null,
            video_checksum: null
          }));
        }
        await Promise.all(eoZoneRecordingPromises);
        await Promise.all(eoCaptureImagePromises);
        var recorder = eoRecorder;
        eoRecorder = null;
        await new Promise(function (resolve) {
          recorder.addEventListener("stop", resolve, { once: true });
          recorder.stop();
        });
        recorder.stream.getTracks().forEach(function (track) { track.stop(); });

        }

        var finalSample = eoTelemetrySamples[eoTelemetrySamples.length - 1];
        var videoUrl = createDownloadUrl(storedVideo.file);
        var videoLink = document.getElementById("web-eo-video-download");
        videoLink.href = videoUrl;
        videoLink.download = videoName;
        videoLink.hidden = false;

        var sha256 = await sha256Hex(storedVideo.file) || "계산할 수 없음";
        var storageMatchesCapture = storedVideo.saved
          && await storedChunksMatchCapture(storedVideo.file, eoRecorderChunkChecksums);
        eoRecorderChunkChecksums = [];
        var missingZones = eoExpectedZones.filter(function (zone) {
          return !eoCaptureEvents.some(function (event) {

          });
        });
        var missingZoneVideos = eoExpectedZones.filter(function (zone) {
          return !eoCaptureEvents.some(function (event) {

          });
        });
        var missingZoneImages = eoExpectedZones.filter(function (zone) {
          return !eoCaptureImages.some(function (image) {
            return image.inspection_zone_id === zone.inspection_zone_id
              && image.download_ready;
          });
        });
        var verifiedZoneImages = eoExpectedZones.length > 0
          && missingZoneImages.length === 0
          && eoCaptureImages.length === eoExpectedZones.length
          && eoCaptureImages.every(function (image) {

              && image.verification_state === "VERIFIED";
          });
        var verifiedZoneVideos = eoExpectedZones.length > 0
          && missingZones.length === 0
          && missingZoneVideos.length === 0
          && eoZoneRecordings.length === eoExpectedZones.length
          && eoZoneRecordings.every(function (recording) {

              && recording.verification_state === "VERIFIED";

          && eoCaptureImages.length === eoExpectedZones.length
          && eoCaptureImages.every(function (image) {

          && eoZoneRecordings.every(function (recording) {

          recording_source: "시뮬레이터 화면의 EO 시점 영역",
          video_file: videoName,
          video_mime_type: videoMimeType,
          video_bytes: storedVideo.file.size,
          storage_state: mediaSaved ? "SAVED" : "CAPTURED",
          storage_backend: mediaSaved ? "OPFS" : "일부 저장 또는 다운로드 전용",
          recording_duration_milliseconds: Math.round(performance.now() - eoRecordingStartedAt),
          mission_outcome: finalSample && finalSample.mission_status.indexOf("영상 수집 완료") >= 0
            ? "COMPLETED" : "FAILED",
          mission_status: finalSample ? finalSample.mission_status : "기록 없음",
          expected_zones: eoExpectedZones,
          captured_zones: eoCaptureEvents,
          captured_images: eoCaptureImages,
          zone_recordings: eoZoneRecordings,
          missing_zones: missingZones,
          missing_zone_videos: missingZoneVideos,
          missing_zone_images: missingZoneImages,
          capture_summary: {
            expected_zone_count: eoExpectedZones.length,
            captured_zone_count: eoCaptureEvents.length,
            missing_zone_count: missingZones.length,
            captured_image_count: eoCaptureImages.filter(function (image) {
              return image.download_ready;
            }).length,
            missing_image_count: missingZoneImages.length
          },
          video_checksum_algorithm: sha256 === "계산할 수 없음" ? null : "SHA-256",
          video_checksum: sha256,
          video_storage_matches_capture: storageMatchesCapture,
          simulation_tick_rate_hz: 60,
          coordinate_frame: "시뮬레이터 로컬 좌표, m",
          sample_interval_milliseconds: 250,
          samples: eoTelemetrySamples
        };
        var manifestBlob = new Blob([JSON.stringify(manifest, null, 2) + "\n"],
          { type: "application/json" });
        var manifestName = videoName.replace(/\.webm$/i, ".manifest.json");
        var storedManifest = await saveRecordingToBrowser(manifestName, manifestBlob);
        var manifestLink = document.getElementById("web-eo-manifest-download");
        manifestLink.href = createDownloadUrl(storedManifest.file);
        manifestLink.download = manifestName;
        manifestLink.hidden = false;
        await refreshSavedRecordingLinks().catch(function (error) {
          setEoRecordingStatus("파일은 저장했지만 목록을 갱신하지 못했습니다: "
            + error.message);
        });
        setEoRecordingStatus((mediaSaved && storedManifest.saved
          ? "영상·기록을 브라우저에 저장했습니다. "
          : "영상·기록을 내려받을 수 있습니다. ") + "구역 "
          + eoCaptureEvents.length + "/" + eoExpectedZones.length + "곳 촬영, 누락 "
          + missingZones.length + "곳 · 구역 영상 누락 " + missingZoneVideos.length
          + "개 · 정지 사진 " + (eoCaptureImages.length - missingZoneImages.length)
          + "장 · 상태 표본 " + eoTelemetrySamples.length + "개");
        eoRecordingFinalizing = false;
      }

      async function startEoRecording() {
        var mimeType = eoRecordingMimeType();
        if (!mimeType) {
          setEoRecordingStatus("이 브라우저는 화면 녹화를 지원하지 않습니다.");
          return false;
        }
        if (eoRecorder)
          return true;

        if (!eoStreamContext || eoStreamCanvas.width === 0 || eoStreamCanvas.height === 0) {
          setEoRecordingStatus("EO 화면을 준비하지 못했습니다.");
          return false;
        }
        eoTelemetrySamples = [];
        eoCaptureImages = [];
        eoCaptureImagePromises = [];
        eoCaptureEvents = [];
        eoZoneRecordings = [];
        eoZoneRecordingPromises = [];
        latestEoCaptureMetadata = null;
        eoRecorderChunks = [];
        eoRecorderChunkChecksums = [];
        document.getElementById("web-eo-zone-downloads").replaceChildren();
        eoRecordingStartedAt = performance.now();
        eoLastTelemetrySampleAt = 0;
        eoRecorderFileName = "DroneSim_Inspection_" + recordingTimestamp() + ".webm";
        var stream = null;
        try {
          eoRecorderSink = await openRecordingSink(eoRecorderFileName);
          stream = eoStreamCanvas.captureStream(20);
          eoRecorder = new MediaRecorder(stream, { mimeType: mimeType });
          eoRecorderVideoTrack = stream.getVideoTracks()[0] || null;
          eoRecorder.addEventListener("dataavailable", function (event) {
            if (!event.data || event.data.size === 0)
              return;
            if (eoRecorderSink)
              eoRecorderSink.append(event.data);
            else
              eoRecorderChunks.push(event.data);
            eoRecorderChunkChecksums.push({
              bytes: event.data.size,
              checksum: sha256Hex(event.data)
            });
          });
          eoRecorder.addEventListener("error", function (event) {
            setEoRecordingStatus("브라우저 녹화 오류: "
              + (event.error?.message || "원인을 확인할 수 없습니다."));
          });
          eoRecorder.start(1000);
          startEoViewportCopy();
          setEoRecordingStatus(eoRecorderSink
            ? "녹화 중 · 브라우저 저장 공간에 조각별 기록"
            : "녹화 중 · 종료 후 브라우저에 저장");
          return true;
        } catch (error) {
          eoRecorder = null;
          if (eoRecorderSink)
            await eoRecorderSink.abort();
          eoRecorderSink = null;
          eoRecorderFileName = "";
          if (stream)
            stream.getTracks().forEach(function (track) { track.stop(); });
          setEoRecordingStatus("녹화를 시작하지 못했습니다: " + error.message);
          return false;
        }
      }

      window.updateDroneSimGroundControl = function (mode, x, y, z, speed, cameraActive,
          captureAssessment, missionStatus, simulationTick, missionActive, grounded) {
        latestGroundControlState = {
          mode: mode, x: x, y: y, z: z, speed: speed,
          cameraActive: cameraActive, captureAssessment: captureAssessment,
          missionStatus: missionStatus, simulationTick: Number(simulationTick),
          missionActive: Boolean(missionActive)
        };
        var captureLabels = {
          ready: "목표가 화면에 보임",
          camera_unavailable: "카메라 꺼짐 또는 장애",
          no_new_frame: "새 영상 프레임 없음",
          too_near: "목표에 너무 가까움",
          too_far: "목표에서 너무 멂",
          surface_facing_away: "카메라가 목표를 향하지 않음",
          outside_frame: "카메라 화면 밖",
          resolution_too_low: "화면에서 목표가 너무 작음",
          occluded: "목표가 구조물에 가려짐",
          unknown: "상태를 확인할 수 없음"
        };
        document.getElementById("web-gcs-mode").textContent = mode;
        document.getElementById("web-gcs-clock").textContent = "T+"
          + (Number(simulationTick) / 60).toFixed(1) + " s · "
          + simulationTick + " Tick";
        document.getElementById("web-gcs-position").textContent = x.toFixed(1)
          + " / " + y.toFixed(1) + " m";
        document.getElementById("web-gcs-altitude").textContent = z.toFixed(1) + " m";
        document.getElementById("web-gcs-speed").textContent = speed.toFixed(1) + " m/s";
        document.getElementById("web-gcs-camera").textContent = cameraActive ? "켜짐" : "꺼짐";
        document.getElementById("web-gcs-capture").textContent = "영상 구도 상태: "
          + (captureLabels[captureAssessment] || captureLabels.unknown)
          + " · 파손 여부는 사람이 영상으로 판단합니다.";
        document.getElementById("web-gcs-mission").textContent = missionStatus;

        var missionCanStart = !missionActive && Boolean(grounded);
        var missionIsPaused = missionStatus.includes("일시 정지");
        var missionCanPause = missionActive && (missionStatus.includes("촬영 위치로 이동 중")
          || missionStatus.includes("카메라 방향을 맞추는 중"));
        document.querySelectorAll("#web-gcs [data-command], #web-gcs [data-axis]")
          .forEach(function (button) { button.disabled = missionActive; });
        document.querySelector("#inspection-target").disabled = missionActive;
        document.querySelector("[data-start-inspection]").disabled = !missionCanStart;
        document.querySelector("[data-pause-inspection]").disabled = !missionCanPause;
        document.querySelector("[data-resume-inspection]").disabled = !missionIsPaused;
        document.querySelector("[data-cancel-inspection]").disabled = !missionActive;

      };

      window.updateDroneSimInspectionMetadata = function (cameraX, cameraY, cameraZ,
          quaternionX, quaternionY, quaternionZ, quaternionW, facilityId, zoneId) {
        if (eoRecorder && latestGroundControlState) {
          var elapsedMilliseconds = performance.now() - eoRecordingStartedAt;
          var state = latestGroundControlState;
          latestEoCaptureMetadata = {
            simulation_tick: state.simulationTick,
            facility_id: facilityId,
            inspection_zone_id: zoneId,
            drone_position_meters: [state.x, state.y, state.z],
            camera_position_meters: [cameraX, cameraY, cameraZ],
            camera_orientation_xyzw: [quaternionX, quaternionY, quaternionZ, quaternionW],
            capture_assessment: state.captureAssessment
          };
          if (eoTelemetrySamples.length === 0
              || elapsedMilliseconds - eoLastTelemetrySampleAt >= 250) {
            eoLastTelemetrySampleAt = elapsedMilliseconds;
            eoTelemetrySamples.push({
              recording_elapsed_milliseconds: Math.round(elapsedMilliseconds),
              simulation_tick: state.simulationTick,
              simulation_time_seconds: state.simulationTick / 60,
              facility_id: facilityId,
              inspection_zone_id: zoneId,
              drone_position_meters: [state.x, state.y, state.z],
              camera_position_meters: [cameraX, cameraY, cameraZ],
              camera_orientation_xyzw: [quaternionX, quaternionY, quaternionZ, quaternionW],
              speed_meters_per_second: state.speed,
              camera_active: state.cameraActive,
              capture_assessment: state.captureAssessment,
              mission_status: state.missionStatus
            });
          }
        }
        if (eoRecorder && latestGroundControlState
            && (latestGroundControlState.missionStatus.indexOf("영상 수집 완료") >= 0
              || latestGroundControlState.missionStatus.indexOf("실패:") >= 0))
          void finishEoRecording();
      };

      (function () {
        var axes = { forward: 0, right: 0, vertical: 0, yaw: 0 };
        function sendAxes() {
          if (typeof Module._DroneSimWebPilotInput === "function")
            Module._DroneSimWebPilotInput(axes.forward, axes.right, axes.vertical, axes.yaw);
        }
        function releaseAll() {
          Object.keys(axes).forEach(function (axis) { axes[axis] = 0; });
          sendAxes();
        }

        document.querySelectorAll("#web-gcs [data-command]").forEach(function (button) {
          button.addEventListener("click", function () {
            if (typeof Module._DroneSimWebFlightCommand === "function")
              Module._DroneSimWebFlightCommand(Number(button.dataset.command));
          });
        });
        document.querySelector("#web-gcs [data-start-inspection]").addEventListener(
            "click", async function () {
          if (eoRecorder || eoRecordingFinalizing) {
            setEoRecordingStatus("현재 정찰 임무의 녹화가 진행 중입니다.");
            return;
          }
          if (!await startEoRecording())
            return;
          releaseAll();
          var targetIndex = Number(document.querySelector("#inspection-target").value);
          beginInspectionCaptureRecord(targetIndex);
          if (typeof Module._DroneSimWebStartInspectionMission !== "function"
              || !Module._DroneSimWebStartInspectionMission(targetIndex))
            void finishEoRecording();
        });
        document.querySelector("#web-gcs [data-pause-inspection]").addEventListener(
            "click", function () {
          if (typeof Module._DroneSimWebPauseInspectionMission === "function")
            Module._DroneSimWebPauseInspectionMission();
        });
        document.querySelector("#web-gcs [data-resume-inspection]").addEventListener(
            "click", function () {
          if (typeof Module._DroneSimWebResumeInspectionMission === "function")
            Module._DroneSimWebResumeInspectionMission();
        });
        document.querySelector("#web-gcs [data-cancel-inspection]").addEventListener(
            "click", function () {
          if (typeof Module._DroneSimWebCancelInspectionMission === "function")
            Module._DroneSimWebCancelInspectionMission();
        });
        document.querySelectorAll("#web-gcs [data-axis]").forEach(function (button) {
          var parts = button.dataset.axis.split(":");
          var axis = parts[0];
          var value = Number(parts[1]);
          function release() {
            axes[axis] = 0;
            sendAxes();
          }
          button.addEventListener("pointerdown", function (event) {
            event.preventDefault();
            axes[axis] = value;
            button.setPointerCapture(event.pointerId);
            sendAxes();
          });
          button.addEventListener("pointerup", release);
          button.addEventListener("pointercancel", release);
          button.addEventListener("lostpointercapture", release);
        });
        window.addEventListener("blur", releaseAll);
        document.addEventListener("visibilitychange", function () {
          if (document.hidden)
            releaseAll();
        });
      })();

      var Module = {
        canvas: document.getElementById("canvas"),
        locateFile: function (path) {
          if (!path.endsWith(".wasm"))
            window.setSimulatorStartupStatus("화면 자료를 불러오고 있습니다.");
          return path + "?rev=" + encodeURIComponent(simulatorVersion);
        },
        setStatus: function (text) {
          if (text && text !== "Running...")
            window.setSimulatorStartupStatus("시뮬레이터를 시작하고 있습니다.");
        },
        monitorRunDependencies: function (remaining) {
          if (remaining > 0)
            window.setSimulatorStartupStatus("시뮬레이터 실행에 필요한 자료를 준비하고 있습니다.");
        },
        onRuntimeInitialized: function () {
          window.setSimulatorStartupStatus("시뮬레이터를 시작하고 있습니다.");
        },
        onAbort: function (reason) {
          window.clearTimeout(startupTimeout);
          showStartupError("시뮬레이터를 시작하지 못했습니다. " + (reason || "새로고침해 주세요."));
        }
      };
    </script>
    <template id="simulator-script-template">
      {{{ SCRIPT }}}
    </template>
    <script>
      (function () {
        var status = document.getElementById("startup-status");
        var message = document.getElementById("startup-message");
        var source = document.getElementById("simulator-script-template").content.querySelector("script");
        if (!source) {
          message.textContent = "시뮬레이터 파일을 찾지 못했습니다. 새로고침해 주세요.";
          status.setAttribute("role", "alert");
          return;
        }

        var script = document.createElement("script");
        Array.from(source.attributes).forEach(function (attribute) {
          script.setAttribute(attribute.name, attribute.value);
        });
        script.src = source.getAttribute("src") + "?rev=" + encodeURIComponent(simulatorVersion);
        script.textContent = source.textContent;
        script.addEventListener("error", function () {
          showStartupError("시뮬레이터 실행 파일을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.");
        });
        window.addEventListener("error", function (event) {
          showStartupError("시뮬레이터 실행 중 오류가 발생했습니다. " + (event.message || "브라우저 콘솔을 확인해 주세요."));
        });
        window.addEventListener("unhandledrejection", function (event) {
          const reason = event.reason && event.reason.message
            ? event.reason.message
            : String(event.reason || "알 수 없는 오류");
          showStartupError("시뮬레이터 자료를 준비하지 못했습니다. " + reason);
        });
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
