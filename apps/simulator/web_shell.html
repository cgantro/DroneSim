<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AeroSimLab 시뮬레이터</title>
    <script src="./coi-serviceworker.min.js"></script>
    <script id="minibcg-asset-package" type="application/octet-stream">__MINIBCG_ASSET_PACKAGE__</script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #141719; }
      body { display: grid; place-items: center; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #startup-status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #e5e7eb; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      #startup-status[hidden] { display: none; }
      #startup-message { max-width: 560px; }
      #startup-retry { display: none; margin: 18px auto 0; padding: 10px 16px; border: 1px solid #94a3b8; border-radius: 6px; background: #1f2937; color: inherit; cursor: pointer; }
      #startup-status[data-failed="true"] #startup-retry { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="startup-status" role="status" aria-live="polite">
      <div id="startup-message">시뮬레이터 실행을 준비하고 있습니다.</div>
      <button id="startup-retry" type="button">다시 시도</button>
    </div>
    <canvas id="canvas" tabindex="0"></canvas>
    <script>
      var Module = {
        canvas: document.getElementById("canvas"),
        getPreloadedPackage: function () {
          var encoded = document.getElementById("minibcg-asset-package").textContent.trim();
          var binary = atob(encoded);
          var packageBytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) packageBytes[i] = binary.charCodeAt(i);
          return packageBytes.buffer;
        }
      };
    </script>
    <template id="simulator-script-template">
      {{{ SCRIPT }}}
    </template>
    <script>
      (function () {
        var status = document.getElementById("startup-status");
        var message = document.getElementById("startup-message");
        var retryButton = document.getElementById("startup-retry");
        var template = document.getElementById("simulator-script-template");

        function showFailure(text) {
          status.dataset.failed = "true";
          status.setAttribute("role", "alert");
          message.textContent = text;
        }

        function startSimulator() {
          var source = template.content.querySelector("script");
          if (!source) {
            showFailure("시뮬레이터를 불러오지 못했습니다. 새로고침해 주세요.");
            return;
          }

          // 브라우저가 공유 메모리를 허용한 뒤에만 WebAssembly 작업 스레드를 시작합니다.
          status.hidden = true;
          var script = document.createElement("script");
          Array.from(source.attributes).forEach(function (attribute) {
            script.setAttribute(attribute.name, attribute.value);
          });
          script.textContent = source.textContent;
          document.body.appendChild(script);
        }

        window.addEventListener("unhandledrejection", function (event) {
          if (event.reason && event.reason.name === "DataCloneError") {
            event.preventDefault();
            status.hidden = false;
            showFailure("브라우저가 시뮬레이터 실행에 필요한 메모리를 허용하지 않았습니다. 새 탭에서 다시 열어 주세요.");
          }
        });

        retryButton.addEventListener("click", function () {
          window.location.reload();
        });

        if (window.crossOriginIsolated && typeof SharedArrayBuffer === "function") {
          var currentUrl = new URL(window.location.href);
          if (currentUrl.searchParams.has("coiRetry")) {
            currentUrl.searchParams.delete("coiRetry");
            window.history.replaceState(null, "", currentUrl);
          }
          startSimulator();
          return;
        }

        if (!window.isSecureContext || !navigator.serviceWorker) {
          showFailure("이 브라우저 환경에서는 시뮬레이터를 실행할 수 없습니다. 보안 연결에서 다시 열어 주세요.");
          return;
        }

        var retryUrl = new URL(window.location.href);
        var alreadyRetried = retryUrl.searchParams.get("coiRetry") === "1";
        var reloadStarted = false;

        function reloadAfterControl() {
          if (alreadyRetried) {
            showFailure("브라우저가 시뮬레이터에 필요한 공유 메모리를 허용하지 않았습니다. 새로고침하거나 새 탭에서 다시 열어 주세요.");
            return;
          }
          if (reloadStarted) return;
          reloadStarted = true;
          retryUrl.searchParams.set("coiRetry", "1");
          window.location.replace(retryUrl);
        }

        if (navigator.serviceWorker.controller) {
          reloadAfterControl();
          return;
        }

        message.textContent = "시뮬레이터 실행을 준비하고 있습니다.";
        var controlTimeout = window.setTimeout(function () {
          navigator.serviceWorker.removeEventListener("controllerchange", onControllerChange);
          showFailure("시뮬레이터 실행 준비가 끝나지 않았습니다. 새로고침하거나 새 탭에서 다시 열어 주세요.");
        }, 15000);

        function onControllerChange() {
          window.clearTimeout(controlTimeout);
          reloadAfterControl();
        }

        navigator.serviceWorker.addEventListener("controllerchange", onControllerChange, { once: true });
        navigator.serviceWorker.ready.then(function () {
          if (navigator.serviceWorker.controller) onControllerChange();
        }).catch(function () {
          window.clearTimeout(controlTimeout);
          showFailure("시뮬레이터 실행 준비에 실패했습니다. 새로고침하거나 새 탭에서 다시 열어 주세요.");
        });
      })();
    </script>
  </body>
</html>
